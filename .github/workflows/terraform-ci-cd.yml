name: "Terraform Enterprise Landing Zone CI/CD"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  validate-and-lint:
    name: "Static Validation & Format"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  security-scan:
    name: "DevSecOps & Compliance Scan (CIS Benchmark)"
    runs-on: ubuntu-latest
    needs: validate-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability & IaC Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Checkov Static Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

  plan:
    name: "Terraform Plan (Zero-Trust Dry Run)"
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init (Validation Mode)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0a122c" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="goldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7971e" />
      <stop offset="100%" stop-color="#ffd200" />
    </linearGradient>

    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0575E6" />
      <stop offset="100%" stop-color="#00F260" />
    </linearGradient>

    <!-- 3D Iso Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#00f2fe" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes floatFast {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-1.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes scanline {
      0% { transform: translateY(-200px); }
      100% { transform: translateY(500px); }
    }
    .floating-1 { animation: floatSlow 7s ease-in-out infinite; }
    .floating-2 { animation: floatFast 5s ease-in-out infinite; }
    .pulse-glow { animation: pulse 4s ease-in-out infinite; }
  </style>

  <!-- Deep Universe Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- 3D Perspective Grid Background (Tron / Cyber Grid) -->
  <g opacity="0.22">
    <!-- Horizon lines with perspective compression -->
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#00f2fe" stroke-width="0.8" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#00f2fe" stroke-width="1.0" />
    <line x1="0" y1="310" x2="1200" y2="310" stroke="#00f2fe" stroke-width="1.3" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#00f2fe" stroke-width="1.6" />
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#00f2fe" stroke-width="2.0" />

    <!-- Perspective vanishing lines originating from (600, 240) -->
    <line x1="600" y1="240" x2="-200" y2="420" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="600" y1="240" x2="0" y2="420" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="600" y1="240" x2="200" y2="420" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="600" y1="240" x2="380" y2="420" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="600" y1="240" x2="520" y2="420" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="600" y1="240" x2="680" y2="420" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="600" y1="240" x2="820" y2="420" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="600" y1="240" x2="1000" y2="420" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="600" y1="240" x2="1200" y2="420" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="600" y1="240" x2="1400" y2="420" stroke="#38bdf8" stroke-width="1.2" />
  </g>

  <!-- Glowing Nebulas / Ambience -->
  <circle cx="200" cy="100" r="140" fill="#7928ca" opacity="0.18" filter="url(#glow)" />
  <circle cx="1020" cy="140" r="160" fill="#00f2fe" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="60" r="180" fill="#0072C6" opacity="0.12" filter="url(#glow)" />

  <!-- Left 3D Isometric Floating Cube (Azure Architecture) -->
  <g class="floating-1" transform="translate(90, 140)">
    <!-- 3D Cube Top -->
    <polygon points="60,10 110,35 60,60 10,35" fill="#38bdf8" opacity="0.9" filter="url(#glowSubtle)" />
    <!-- 3D Cube Left Face -->
    <polygon points="10,35 60,60 60,120 10,95" fill="#0284c7" opacity="0.95" />
    <!-- 3D Cube Right Face -->
    <polygon points="60,60 110,35 110,95 60,120" fill="#0369a1" opacity="0.95" />
    <!-- Inner glowing cyber lines on cube -->
    <line x1="60" y1="10" x2="60" y2="60" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    <text x="60" y="85" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1">AZURE</text>
    <text x="60" y="103" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#7dd3fc" letter-spacing="1">HUB 0.0.0.0</text>
  </g>

  <!-- Right 3D Isometric Floating Diamond (Zero Trust & Sentinel) -->
  <g class="floating-2" transform="translate(1010, 130)">
    <!-- 3D Diamond Top -->
    <polygon points="60,10 110,35 60,60 10,35" fill="#a855f7" opacity="0.9" filter="url(#glowSubtle)" />
    <!-- 3D Diamond Left Face -->
    <polygon points="10,35 60,60 60,120 10,95" fill="#7e22ce" opacity="0.95" />
    <!-- 3D Diamond Right Face -->
    <polygon points="60,60 110,35 110,95 60,120" fill="#581c87" opacity="0.95" />
    <!-- Symbol / Text -->
    <text x="60" y="85" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1">SECURITY</text>
    <text x="60" y="103" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#e9d5ff" letter-spacing="1">CIS v2.0</text>
  </g>

  <!-- Central 3D Glassmorphism Hero Panel -->
  <g transform="translate(240, 45)" filter="url(#shadow3d)">
    <!-- Back Glow Rim -->
    <rect x="-2" y="-2" width="724" height="274" rx="18" fill="url(#cardBorder)" />
    <!-- Main Card Body -->
    <rect x="0" y="0" width="720" height="270" rx="16" fill="url(#cardGrad1)" />

    <!-- Top Status Indicator Pill -->
    <g transform="translate(230, 22)">
      <rect x="0" y="0" width="260" height="28" rx="14" fill="#0c1a32" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#00f2fe" filter="url(#glowSubtle)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="18" font-family="'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">PRODUCTION LANDING ZONE</text>
    </g>

    <!-- Name / Main Identity Header -->
    <text x="360" y="98" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="2">
      ABHISHEK CHAUHAN
    </text>

    <!-- Subtitle with Glowing Cyber Gradient -->
    <text x="360" y="132" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700" fill="url(#cyanNeon)" letter-spacing="3.5">
      LEAD CLOUD SOLUTIONS &amp; DEVSECOPS ARCHITECT
    </text>

    <!-- Architecture Pillars Badge Row (3D Glass Pills) -->
    <g transform="translate(30, 160)">
      <!-- Pill 1: Hub & Spoke -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="155" height="36" rx="8" fill="#132238" stroke="#0284c7" stroke-width="1" />
        <text x="77" y="23" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">🛡️ Hub-Spoke FW</text>
      </g>

      <!-- Pill 2: Zero Trust -->
      <g transform="translate(168, 0)">
        <rect x="0" y="0" width="155" height="36" rx="8" fill="#1e1838" stroke="#9333ea" stroke-width="1" />
        <text x="77" y="23" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11.5" font-weight="700" fill="#d8b4fe">🔒 Zero-Trust CMK</text>
      </g>

      <!-- Pill 3: BCDR -->
      <g transform="translate(336, 0)">
        <rect x="0" y="0" width="155" height="36" rx="8" fill="#102824" stroke="#059669" stroke-width="1" />
        <text x="77" y="23" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11.5" font-weight="700" fill="#6ee7b7">⚡ BCDR 15m RPO</text>
      </g>

      <!-- Pill 4: FinOps & Governance -->
      <g transform="translate(504, 0)">
        <rect x="0" y="0" width="155" height="36" rx="8" fill="#2d2112" stroke="#d97706" stroke-width="1" />
        <text x="77" y="23" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="11.5" font-weight="700" fill="#fde68a">⚖️ CIS v2.0 FinOps</text>
      </g>
    </g>

    <!-- Bottom Tech Specs Line -->
    <text x="360" y="235" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="1">
      Azure Firewall IDPS | Bastion | CMK 4096-bit | Sentinel | ASR East-Central US | GFS Backup
    </text>
  </g>

  <!-- Bottom Floating Status Bar -->
  <g transform="translate(300, 345)">
    <rect x="0" y="0" width="600" height="42" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="30" cy="21" r="5" fill="#22c55e" />
    <text x="46" y="26" font-family="'Segoe UI', monospace" font-size="12" font-weight="600" fill="#cbd5e1">
      Status: <tspan fill="#4ade80">ONLINE &amp; PRODUCTION READY</tspan>
    </text>
    <text x="400" y="26" font-family="'Segoe UI', monospace" font-size="12" font-weight="600" fill="#94a3b8">
      Target SLA: <tspan fill="#38bdf8">99.99% High Availability</tspan>
    </text>
  </g>
</svg>
